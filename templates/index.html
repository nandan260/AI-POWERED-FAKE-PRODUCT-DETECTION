<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProductGuard - AI Powered Fake Product Detection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    background: #ffffff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #2F4156;
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: #2F4156;
    text-decoration: none;
    transition: color 0.15s ease, background 0.15s ease;
  }
  a:hover {
    color: #567C8D;
  }
  * {
    box-sizing: border-box;
  }
  .fade-in {
    opacity: 0;
    transform: translateY(18px);
    filter: blur(6px);
    transition: opacity 1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1), filter 1s ease;
  }
  .fade-in.ready {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
  .search-form:focus-within {
    box-shadow: 0 0 0 6px rgba(200,217,230,0.6), 0 10px 30px -12px rgba(47,65,86,0.25) !important;
  }
  .btn-hover:hover {
    background: #567C8D !important;
    color: #fff !important;
  }
  .step-item {
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.5s ease;
    color: #567C8D;
  }
  .step-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: #2F4156;
    transition: opacity 0.5s ease, transform 0.5s ease;
    opacity: 0;
    transform: scale(0);
  }
  .step-item.active {
    color: #2F4156;
  }
  .step-item.active .step-dot {
    opacity: 1;
    transform: scale(1);
  }
</style>
</head>
<body>
<div style="min-height:100vh;padding:0;display:flex;flex-direction:column">
  <div style="position:relative;flex:1;min-height:100vh;background:#fff;overflow:hidden;display:flex;flex-direction:column">
    
    <!-- Canvas Particle Wave Background -->
    <canvas id="bgCanvas" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>

    <!-- Top Navigation Bar -->
    <nav style="position:relative;display:flex;justify-content:center;align-items:center;gap:32px;padding:18px 24px;flex-wrap:wrap">
      <a href="/" style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#2F4156"><path d="M12 2 4 5v7c0 6 8 10 8 10s8-4 8-10V5z"></path></svg>
        ProductGuard
      </a>
      <div style="display:flex;gap:28px;font-size:14px;color:#567C8D">
        <a href="/manufacturer/login">Manufacturer</a>
        <a href="/seller/login">Seller</a>
        <a href="/consumer/dashboard">Consumer</a>
        <a href="/history">History</a>
      </div>
      <a href="/consumer/login" class="btn-hover" style="padding:8px 18px;background:#2F4156;color:#fff;border-radius:999px;font-size:14px;font-weight:600">Sign in</a>
    </nav>

    <!-- Hero Content -->
    <main style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px;gap:18px">
      <h1 style="margin:0;font-size:clamp(34px,4.5vw,56px);line-height:1.1;font-weight:600;letter-spacing:-0.035em">
        <span class="fade-in" id="heroSubtitle" style="display:block;color:#567C8D;transition-delay:0.1s">AI Powered</span>
        <span class="fade-in" id="heroTitle" style="display:block;transition-delay:0.25s">Fake Product Detection</span>
      </h1>
      <p class="fade-in" id="heroDesc" style="margin:0;max-width:420px;font-size:15px;line-height:1.5;color:#567C8D;text-wrap:pretty;transition-delay:0.45s">
        Verify product authenticity using AI, Blockchain and QR Code Verification.
      </p>

      <!-- Verify Search Form -->
      <form id="verifyForm" class="fade-in search-form" style="margin-top:8px;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 20px;width:min(100%,440px);background:#fff;border:1px solid #C8D9E6;border-radius:999px;box-shadow:0 10px 30px -12px rgba(47,65,86,0.25);transition-delay:0.6s">
        <input id="serialInput" placeholder="Enter product serial number" style="flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:14px;background:transparent;color:#2F4156">
        <button type="submit" class="btn-hover" style="height:40px;padding:0 20px;border:0;border-radius:999px;background:#2F4156;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 8px 18px -6px rgba(47,65,86,0.28), 0 4px 14px -6px rgba(86,124,141,0.25)">Verify</button>
      </form>
    </main>

    <!-- Footer Workflow Steps -->
    <footer id="footerSteps" class="fade-in" style="position:relative;display:flex;justify-content:center;flex-wrap:wrap;gap:8px 36px;padding:18px 20px 24px;font-size:13px;font-weight:600;color:#567C8D;transition-delay:0.8s">
      <span class="step-item active" data-step="0"><span class="step-dot"></span><span style="font-size:12px;font-weight:500">01</span>Manufacturer</span>
      <span class="step-item" data-step="1"><span class="step-dot"></span><span style="font-size:12px;font-weight:500">02</span>Seller</span>
      <span class="step-item" data-step="2"><span class="step-dot"></span><span style="font-size:12px;font-weight:500">03</span>Consumer</span>
      <span class="step-item" data-step="3"><span class="step-dot"></span><span style="font-size:12px;font-weight:500">04</span>AI Verification</span>
      <span class="step-item" data-step="4"><span class="step-dot"></span><span style="font-size:12px;font-weight:500">05</span>Blockchain</span>
    </footer>

  </div>
</div>

<script>
  // Dynamic Canvas Wave Background
  (function() {
    const c = document.getElementById('bgCanvas');
    if (!c) return;
    let ctx, w, h, dots = [], t0 = null, raf = null;

    function build() {
      const dpr = window.devicePixelRatio || 1;
      w = c.offsetWidth;
      h = c.offsetHeight;
      c.width = w * dpr;
      c.height = h * dpr;
      ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      let seed = 7;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const blobs = [
        { cx: w * 0.1, cy: h * 0.55, rx: w * 0.22, ry: h * 0.2 },
        { cx: w * 0.92, cy: h * 0.6, rx: w * 0.2, ry: h * 0.18 }
      ];
      dots = [];
      for (let py = 0; py < h; py += 7) {
        for (let px = 0; px < w; px += 7) {
          let d = 0;
          for (const b of blobs) {
            const dx = (px - b.cx) / b.rx;
            const dy = (py - b.cy) / b.ry;
            d = Math.max(d, 1 - Math.sqrt(dx * dx + dy * dy));
          }
          d += Math.sin(px * 0.02 + py * 0.05) * 0.12;
          if (d <= -0.15 || rnd() > Math.max(d, 0.04) * 1.6) continue;
          dots.push({ px, py, d, ph: rnd() * 6.28, delay: (Math.abs(px - w / 2) / w) * 900 });
        }
      }
    }

    function frame(t) {
      if (!ctx) return;
      if (!t0) t0 = t;
      const e = t - t0;
      const s = t / 1000;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#2F4156';

      for (const p of dots) {
        const intro = Math.min(1, Math.max(0, (e - p.delay) / 700));
        if (intro <= 0) continue;
        const wave = Math.sin(p.px * 0.012 - s * 1.2 + p.py * 0.02) * 0.22 + Math.sin(s * 2 + p.ph) * 0.08;
        const d = p.d + wave;
        if (d <= 0) continue;
        ctx.globalAlpha = Math.min(1, d * 1.5) * intro;
        const dy = Math.sin(s * 0.8 + p.px * 0.01) * 2;
        ctx.beginPath();
        ctx.arc(p.px, p.py + dy, 0.5 + Math.min(1, d) * 1.6, 0, 6.283);
        ctx.fill();
      }
      raf = requestAnimationFrame(frame);
    }

    window.addEventListener('resize', build);
    build();
    raf = requestAnimationFrame(frame);
  })();

  // Entrance Transition
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
      document.querySelectorAll('.fade-in').forEach(function(el) {
        el.classList.add('ready');
      });
    }, 60);

    // Form submission
    const form = document.getElementById('verifyForm');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const val = document.getElementById('serialInput').value.trim();
        if (val) {
          window.location.href = '/verify/' + encodeURIComponent(val);
        } else {
          window.location.href = '/verify';
        }
      });
    }

    // Step cycle in footer
    const steps = document.querySelectorAll('.step-item');
    let active = 0;
    setInterval(function() {
      if (!steps.length) return;
      steps[active].classList.remove('active');
      active = (active + 1) % steps.length;
      steps[active].classList.add('active');
    }, 1800);
  });
</script>
</body>
</html>

{% extends "base.html" %}

{% block title %}Manufacturer Login{% endblock %}

{% block content %}
<div class="auth-page">
<div class="card">

<h2>Manufacturer Login</h2>

<form method="POST">

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit">Login</button>

</form>

</div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Consumer Registration{% endblock %}

{% block content %}
<div class="auth-page">
<div class="card">

<h2>Consumer Registration</h2>

<form method="POST">

    <label>Full Name</label>
    <input type="text" name="full_name" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <input type="submit" value="Register">

</form>

<br>

<a href="/">Home</a>
<a href="{{ url_for('consumer_register') }}">Consumer Register</a>

</div>
</div>
{% endblock %}

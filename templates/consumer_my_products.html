{% extends "base.html" %}

{% block title %}My Products{% endblock %}

{% block content %}

<h2>My Products</h2>

<div class="table-wrap">
<table>

<tr>
<th>Brand</th>
<th>Product</th>
<th>Model</th>
<th>Serial No</th>
<th>Status</th>
</tr>

{% for product in products %}

<tr>
<td>{{ product[1] }}</td>  
<td>{{ product[2] }}</td>   
<td>{{ product[3] }}</td>   
<td>{{ product[4] }}</td>   
<td>{{ product[6] }}</td>
</tr>

{% endfor %}

</table>
</div>

<br>

<a href="/consumer/dashboard">Back</a>

{% endblock %}
